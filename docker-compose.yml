services:
  bot:
    build: .
    container_name: lastfmbucket-bot
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama

  admin:
    build: .
    container_name: lastfmbucket-admin
    env_file: .env
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    command: python src/admin.py
    environment:
      - ADMIN_PORT=8080

  ollama:
    image: ollama/ollama:latest
    container_name: lastfmbucket-ollama
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_NUM_THREADS=4
      - OLLAMA_CONTEXT_LENGTH=1024
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  ollama_data:
